<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <a href="#" class="navbar-brand d-flex align-items-center">
                <i class="bi bi-kanban-fill text-primary me-2"></i>
                <span class="fw-bold tracking-tight">TaskFlow</span>
            </a>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">ABP - Módulo 4</span>
        </div>
    </nav>

    <main class="container my-4">
        <div class="row g-4">
            <section class="col-lg-4 sticky-sidebar">
                <div class="card bg-secondary bg-opacity-10 border-secondary mb-3">
                    <div class="card-header bg-transparent border-secondary py-3">
                        <h5 class="card-title m-0 text-primary fw-bold">
                            <i class="bi bi-plus-circle-fill me-2"></i>Nueva Tarea
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="task-form" novalidate>
                            <div class="mb-3">
                                <label for="task-desc" class="form-label text-secondary small uppercase fw-bold">Descripción de la Tarea</label>
                                <textarea class="form-control bg-dark border-secondary text-light" id="task-desc" rows="3" placeholder="¿Qué necesitas hacer hoy?" required></textarea>
                                <div class="invalid-feedback">Por favor, escribe una descripción.</div>
                            </div>

                            <div class="mb-3">
                                <label for="task-deadline" class="form-label text-secondary small uppercase fw-bold">Fecha Límite (Opcional)</label>
                                <input type="datetime-local" class="form-control bg-dark border-secondary text-light" id="task-deadline">
                            </div>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <label for="task-priority" class="form-label text-secondary small uppercase fw-bold">Prioridad</label>
                                    <select class="form-select bg-dark border-secondary text-light" id="task-priority">
                                        <option value="baja" selected>Baja</option>
                                        <option value="media">Media</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="task-category" class="form-label text-secondary small uppercase fw-bold">Clasificación</label>
                                    <select class="form-select bg-dark border-secondary text-light" id="task-category">
                                        <option value="personal" selected>Personal</option>
                                        <option value="trabajo">Trabajo</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 d-flex align-items-center justify-content-center" id="btn-submit">
                                <span class="spinner-border spinner-border-sm me-2 d-none" id="form-spinner" role="status" aria-hidden="true"></span>
                                <span id="btn-text">Agregar Tarea</span>
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card bg-secondary bg-opacity-10 border-secondary d-none d-lg-block" id="stats-card">
                    <div class="card-header bg-transparent border-secondary py-3">
                        <h5 class="card-title m-0 text-primary fw-bold">
                            <i class="bi bi-bar-chart-fill me-2"></i> Tu Rendimiento
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <span class="small text-secondary fw-bold">Progreso General</span>
                                <span class="small text-primary fw-bold" id="stats-percentage">0%</span>
                            </div>
                            <div class="progress bg-dark border border-secondary" style="height: 10px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                                    role="progressbar" id="stats-progress-bar" style="width: 0%;">
                                </div>
                            </div>
                        </div>
                        <div class="row g-2 text-center mt-2">
                            <div class="col-4">
                                <div class="p-2 rounded bg-dark border border-secondary">
                                    <i class="bi bi-list-task text-primary fs-5 d-block mb-1"></i>
                                    <span class="d-block small text-secondary fw-bold">Total</span>
                                    <span class="fs-5 fw-bold" id="stats-total">0</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 rounded bg-dark border border-secondary">
                                    <i class="bi bi-check-circle-fill text-success fs-5 d-block mb-1"></i>
                                    <span class="d-block small text-secondary fw-bold">Listas</span>
                                    <span class="fs-5 fw-bold text-success" id="stats-completed">0</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 rounded bg-dark border border-secondary">
                                    <i class="bi bi-clock-history text-warning fs-5 d-block mb-1"></i>
                                    <span class="d-block small text-secondary fw-bold">Pend.</span>
                                    <span class="fs-5 fw-bold text-warning" id="stats-pending">0</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="card bg-secondary bg-opacity-10 border-secondary">
                    <div class="card-header bg-transparent border-secondary py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h5 class="card-title m-0 text-primary fw-bold">
                            <i class="bi bi-list-task me-2"></i>Mis Tareas
                        </h5>
                        <div class="input-group input-group-sm max-w-250">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                            <input type="text" id="search-input" class="form-control bg-dark border-secondary text-light" placeholder="Buscar tarea...">
                        </div>
                    </div>

                    <div class="card-body">
                        <div class="tasks-scroll-container">
                            <div id="tasks-container" class="row row-cols-1 g-3">
                                <div class="text-center py-5 text-secondary" id="empty-state">
                                    <i class="bi bi-journal-x display-4"></i>
                                    <p class="mt-2">No hay tareas pendientes. ¡Buen trabajo!</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="app-toast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <span id="toast-message">Acción realizada con éxito.</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
